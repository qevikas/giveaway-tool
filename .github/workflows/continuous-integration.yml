name: Giveaway Tool Continuous Integration

on: 
  push: 
    branches: ['main','gt-*']
  pull_request: 
    branches: 'main'
  workflow_dispatch:

permissions: 
  contents: read

jobs:
  build-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Solution
        run: dotnet build giveaway-tool.slnx --configuration Release --no-restore
